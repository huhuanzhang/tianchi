name: CPU checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q training augmentation simulation scripts
      - run: python -m unittest augmentation.test_clean_augment augmentation.test_joint_dropout augmentation.test_image_crop training.test_distributed training.test_checkpoint training.test_rtc
      - run: python -m simulation.check_rtc
      - run: python -m simulation.check_rtc_queue
      - run: bash -n scripts/train.sh
